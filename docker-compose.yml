services:
  db:
    image: postgres:16-alpine
    container_name: qrconso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrconso
      POSTGRES_PASSWORD: qrconso
      POSTGRES_DB: qrconso
    ports:
      - "5433:5432"
    volumes:
      - qrconso-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrconso"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qrconso-data:
